https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/spotify.list, policy=Spotify, tag=spotify, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/google.list, policy=Google, tag=google, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/netflix.list, policy=Netflix, tag=netflix, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/speedtest.list, policy=Speedtest, tag=speedtest, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/apple-cn.list, policy=DIRECT, tag=apple-cn, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/apple.list, policy=Apple, tag=apple, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/games.list, policy=Games, tag=games, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/cdn.list, policy=CDN, tag=cdn, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/proxy.list, policy=节点选择, tag=proxy, enabled=true
https://raw.githubusercontent.com/QuixoticHeart/rule-set/ruleset/loon/cn.list, policy=DIRECT, tag=cn, enabled=true

[Host]
services.googleapis.cn = services.googleapis.com
google.cn = google.com

[MITM]
# 默认关闭 HTTPS 解密，尚未配置解密域名和 CA 证书
# 如需开启，先在 Loon 中生成、安装并信任证书，再配置 hostname 和 enable=true
enable = false
