name: Update profile stats

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&title_color=1abc9c&icon_color=1abc9c&disable_animations=true'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Commit generated card
        shell: bash
        run: |
          set -euo pipefail

          git add -- profile/stats.svg

          if git diff --cached --quiet; then
            echo "Profile stats card is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update GitHub stats card"
          git push origin "HEAD:${GITHUB_REF_NAME}"
